<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Competitor Analysis — Cash Management &amp; Trade Finance</title>
<style>
:root{
  --green:#00915A; --green-d:#00734A; --green-l:#E6F4EE;
  --ink:#1D2328; --ink2:#4A545C; --ink3:#78838C; --line:#DDE2E6; --line2:#EEF1F3;
  --bg:#F6F7F8; --card:#FFFFFF; --warn:#9A6200; --warn-bg:#FFF6E0; --err:#B3261E; --err-bg:#FDECEA; --ok:#1B7F4B;
  --lim:#E3E6E9; --sanc:#9AA1A8;
  --r:10px; --sh:0 1px 2px rgba(16,24,32,.06),0 2px 8px rgba(16,24,32,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-d)}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:600}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c4ccd2;background:#fafbfb}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.danger{color:var(--err);border-color:#f0c7c3}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 9px;font-size:12.5px}
input[type=text],input[type=password],input[type=search],select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.callout{border-radius:8px;padding:10px 12px;font-size:13px}
.callout.warn{background:var(--warn-bg);color:#5c3c00;border:1px solid #f2dca3}
.callout.err{background:var(--err-bg);color:#6b1510;border:1px solid #f3c2bd}
.callout.info{background:var(--green-l);color:#0b4a33;border:1px solid #bfe3d2}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t th{font-weight:600;color:var(--ink2);font-size:12.5px;background:#fafbfb}
sup.ref{font-size:10px;line-height:0}
sup.ref a{color:var(--ink3);text-decoration:none;margin-left:1px;cursor:pointer}
sup.ref a:hover{color:var(--green-d);text-decoration:underline}

/* Verrouillage */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#F6F7F8 0%,#EDF3F0 100%)}
#lock .box{width:min(420px,92vw);padding:28px}
#lock .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:.5px;flex:none}
#lock label{display:block;font-size:12.5px;color:var(--ink2);margin:12px 0 4px}
#lock input{width:100%}
#lock .err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px}
#lock .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}

/* Application */
#app{display:flex;flex-direction:column;min-height:100%}
header.top{background:#fff;border-bottom:1px solid var(--line);border-top:3px solid var(--green);position:sticky;top:0;z-index:20}
header.top .in{display:flex;align-items:center;gap:14px;padding:10px 20px}
header.top .ttl{display:flex;flex-direction:column}
header.top .ttl b{font-size:15px}
header.top .ttl span{font-size:12px;color:var(--ink3)}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--green-l);color:var(--green-d)}
.badge.std{background:#EEF1F3;color:var(--ink2)}
nav.tabs{display:flex;gap:2px;padding:0 14px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--green);font-weight:600}
nav.tabs .sep{flex:1}
main{flex:1;padding:18px 20px 30px;max-width:1500px;width:100%;margin:0 auto}
footer.disc{font-size:12px;color:var(--ink3);padding:10px 20px 16px;text-align:center}

/* Puces concurrents */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 8px;background:#fff;cursor:pointer;font-size:13px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.mbadge{display:inline-block;min-width:44px;text-align:center;font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;letter-spacing:.2px}

/* Carte */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mapbox{position:relative;overflow:hidden;background:#F2F6F8;border-radius:var(--r);border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
.mapbox svg.drag{cursor:grabbing}
.mapbox path.c,.mapbox circle.c{stroke:#fff;stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer}
.mapbox path.c:hover,.mapbox circle.c:hover{stroke:var(--ink);stroke-width:1.3}
.mapbox path.c.hl,.mapbox circle.c.hl{stroke:var(--ink);stroke-width:1.6}
.mapbox path.bgc{fill:#E7EAEC;stroke:#fff;stroke-width:.4;vector-effect:non-scaling-stroke}
.mapbox circle.c{stroke:#fff;stroke-width:.8}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:16px;line-height:1}
.zoomto{position:absolute;left:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap}
.zoomto button{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:7px;padding:3px 8px;cursor:pointer;font-size:12px}
#tip{position:fixed;pointer-events:none;z-index:60;background:#1D2328;color:#fff;font-size:12.5px;padding:7px 9px;border-radius:7px;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#tip b{display:block;margin-bottom:2px}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.legend .it{display:flex;align-items:center;gap:8px}
.legend .sw{width:22px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.08);flex:none}
.scale{display:flex;height:12px;border-radius:3px;overflow:hidden}
.scale span{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
.kpi b{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.side h3{margin-bottom:8px}
.side .sec{margin-bottom:16px}
.toplist{display:flex;flex-direction:column;gap:3px}
.toplist button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;text-align:left}
.toplist button:hover{background:var(--line2)}

/* Pays */
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(150px,1.3fr) 120px 1fr 70px;gap:12px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.crow:hover{background:#fafbfb}
.barcode{display:flex;gap:2px}
.barcode i{width:16px;height:14px;border-radius:2px;display:block}
.conttabs{display:flex;gap:4px;flex-wrap:wrap}
.conttabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;cursor:pointer;font-size:13px}
.conttabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* Tiroir pays */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;box-shadow:-8px 0 30px rgba(16,24,32,.15);z-index:40;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#drawer .bd{padding:16px 18px;overflow:auto;flex:1}
#veil{position:fixed;inset:0;background:rgba(16,24,32,.25);z-index:39;display:none}
#veil.on{display:block}
.brow{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.brow .nm{cursor:pointer}
.brow .nm:hover{text-decoration:underline}

/* Concurrents */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bcard{border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.bcard:hover{border-color:#c4ccd2}
.bcard .band{height:6px}
.bcard .in{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.bcard .nums{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:auto}
.bcard .nums b{color:var(--ink);font-size:15px}
.bhead{border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line)}
.bhead .band{height:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.facts .f{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;background:#fcfcfd}
.facts .f h4{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.stack{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--line2)}
.stack span{display:block;height:100%}
.covrow{display:grid;grid-template-columns:130px 1fr 150px;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.ctags{display:flex;flex-wrap:wrap;gap:5px}
.ctag{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:12.5px;cursor:pointer}
.ctag:hover{border-color:var(--ink3)}
.ctag em{font-style:normal;color:var(--ink3);margin-left:4px}
.prose p{margin:0 0 10px}
.infog{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
details.fold{border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px}
details.fold summary{cursor:pointer;padding:10px 12px;font-weight:600}
details.fold .prose{padding:0 14px 6px}

/* Tableau */
.tblwrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.mx{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.mx th,table.mx td{padding:5px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.mx thead th{position:sticky;top:0;background:#fff;z-index:2;font-weight:600;color:var(--ink2);vertical-align:bottom;text-align:left}
table.mx thead th .bar{height:4px;border-radius:2px;margin-bottom:4px}
table.mx td.cn,table.mx th.cn{position:sticky;left:0;background:#fff;z-index:1}
table.mx thead th.cn{z-index:3}
table.mx tbody tr{cursor:pointer}
table.mx tbody tr:hover td{background:#fafbfb}
table.mx td.c,table.mx th.c{text-align:center}

/* Fenêtre */
#modal{position:fixed;inset:0;background:rgba(16,24,32,.35);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
#modal label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 4px}
#modal input{width:100%}
.checks{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.ck i{font-style:normal;font-weight:700;width:16px;flex:none}
.ck.ok i{color:var(--ok)} .ck.warn i{color:var(--warn)} .ck.err i{color:var(--err)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1D2328;color:#fff;padding:9px 14px;border-radius:8px;z-index:80;font-size:13px;display:none}
.empty{text-align:center;padding:50px 20px;color:var(--ink2)}
.empty h2{margin-bottom:8px}
.srcl{padding-left:22px;margin:0}
.srcl li{margin-bottom:5px;font-size:13px;word-break:break-word}
.srcl li.hl{background:#FFF6D6;border-radius:4px}
@media (max-width:900px){
  .mapwrap{grid-template-columns:1fr}
  .crow{grid-template-columns:1fr 70px}
  .crow .cc,.crow .barcode{display:none}
  .covrow{grid-template-columns:90px 1fr}
  .covrow .cl{display:none}
  header.top .in{flex-wrap:wrap}
  main{padding:14px 12px 26px}
}
</style>
</head>

<div id="lock">
  <div class="box card">
    <div class="brand"><div class="logo">CA</div><div><b id="lkTitle">Competitor Analysis</b><div class="muted small" id="lkSub"></div></div></div>
    <div id="lkForm"></div>
    <div class="err" id="lkErr"></div>
    <div class="foot">
      <select id="lkLang" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option><option value="nl">Nederlands</option></select>
      <button class="btn ghost sm" id="lkReset"></button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="in">
      <div class="logo">CA</div>
      <div class="ttl"><b>Competitor Analysis</b><span id="hdSub"></span></div>
      <span class="badge" id="hdEd"></span>
      <div class="grow"></div>
      <span class="muted small" id="hdData"></span>
      <select id="hdLang" aria-label="Langue"><option value="fr">FR</option><option value="en">EN</option><option value="nl">NL</option></select>
      <button class="btn sm" id="hdLock"></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
  <footer class="disc" id="disc"></footer>
</div>

<div id="veil"></div>
<aside id="drawer" aria-hidden="true"><div class="hd" id="drHd"></div><div class="bd" id="drBd"></div></aside>
<div id="modal"><div class="box card" id="mdBox"></div></div>
<div id="tip" class="hidden"></div>
<div id="toast"></div>

function hexRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function tint(hex,f){const [r,g,b]=hexRgb(hex);const m=c=>Math.round(255-(255-c)*f);return `rgb(${m(r)},${m(g)},${m(b)})`;}
function lum(hex,f){const [r,g,b]=hexRgb(hex).map(c=>(255-(255-c)*f)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b;}

/* Base64 maison (atob/btoa volontairement non utilisés) */
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const B64R=new Uint8Array(256);for(let i=0;i<64;i++)B64R[B64.charCodeAt(i)]=i;
function toB64(u){let out=[],s='';for(let i=0;i<u.length;i+=3){const a=u[i],b=u[i+1],c=u[i+2];s+=B64[a>>2]+B64[((a&3)<<4)|((b??0)>>4)]+(i+1<u.length?B64[((b&15)<<2)|((c??0)>>6)]:'=')+(i+2<u.length?B64[c&63]:'=');if(s.length>8192){out.push(s);s='';}}out.push(s);return out.join('');}
function fromB64(s){s=s.replace(/[^A-Za-z0-9+/]/g,'');const n=Math.floor(s.length*3/4);const u=new Uint8Array(n);let j=0;for(let i=0;i<s.length;i+=4){const a=B64R[s.charCodeAt(i)],b=B64R[s.charCodeAt(i+1)],c=B64R[s.charCodeAt(i+2)],d=B64R[s.charCodeAt(i+3)];u[j++]=(a<<2)|(b>>4);if(i+2<s.length)u[j++]=((b&15)<<4)|(c>>2);if(i+3<s.length)u[j++]=((c&3)<<6)|d;}return u.subarray(0,j);}

/* ---------- Stockage (IndexedDB) ---------- */
let DBP=null;
function idb(){if(!DBP)DBP=new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return DBP;}
async function kvGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function kvSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function kvClear(){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

/* ---------- Chiffrement : AES-GCM 256, clé PBKDF2-SHA-256 310 000 itérations ---------- */
function rand(n){return crypto.getRandomValues(new Uint8Array(n));}
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PBKDF2_IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function enc(key,obj){const iv=rand(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))));return {iv:toB64(iv),ct:toB64(ct)};}
async function dec(key,box){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(box.iv)},key,fromB64(box.ct));return JSON.parse(td.decode(pt));}
async function sha256hex(buf){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',buf));return [...h].map(b=>b.toString(16).padStart(2,'0')).join('');}

/* ---------- Modèle (recalculé à partir des données) ---------- */
function buildModel(){
  const D=STATE&&STATE.data;if(!D){M=null;return;}
  const banks=D.banks.map((b,i)=>({...b,color:(BREF[b.id]&&BREF[b.id].color)||FALLBACK_COLORS[i%FALLBACK_COLORS.length],short:(BREF[b.id]&&BREF[b.id].short)||b.name,abbr:(BREF[b.id]&&BREF[b.id].abbr)||b.name.slice(0,4)}));
  const bi=Object.fromEntries(banks.map((b,i)=>[b.id,i]));
  const stats=banks.map(()=>({tot:{onshore:0,pass:0,xb:0,lim:0,sanc:0},mode:{},cont:{}}));
  D.countries.forEach((c,ci)=>{
    c.on=0;c.pass=0;
    c.cells.forEach((cell,k)=>{const g=MODE_GROUP[cell.code];if(!g)return;const s=stats[k];s.tot[g]++;s.mode[cell.code]=(s.mode[cell.code]||0)+1;
      const cc=s.cont[c.cont]||(s.cont[c.cont]={onshore:0,pass:0,xb:0,lim:0,sanc:0});cc[g]++;
      if(g==='onshore')c.on++;if(g==='pass')c.pass++;});
  });
  const byName=new Map(D.countries.map((c,i)=>[c.n,i]));
  const shape=new Map();if(MAP)MAP.c.forEach((s,i)=>shape.set(s.n,i));
  D.countries.forEach(c=>{const s=MAP&&shape.has(c.n)?MAP.c[shape.get(c.n)]:null;c.iso=s?s.i:'';});
  M={D,banks,bi,stats,byName,shape};
}

  const zoom=(f,cx,cy)=>{const nw=Math.min(MAP.w,Math.max(MAP.w/40,VB[2]/f));const nh=nw*MAP.h/MAP.w;if(cx==null){cx=VB[0]+VB[2]/2;cy=VB[1]+VB[3]/2;}
    const rx=(cx-VB[0])/VB[2],ry=(cy-VB[1])/VB[3];VB=[cx-rx*nw,cy-ry*nh,nw,nh];clampVB();setVB();};
  const clampVB=()=>{VB[0]=Math.max(-VB[2]*.3,Math.min(MAP.w-VB[2]*.7,VB[0]));VB[1]=Math.max(-VB[3]*.3,Math.min(MAP.h-VB[3]*.7,VB[1]));};
  const pt=e=>{const r=svg.getBoundingClientRect();return [VB[0]+(e.clientX-r.left)/r.width*VB[2],VB[1]+(e.clientY-r.top)/r.height*VB[3]];};
  svg.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=pt(e);zoom(e.deltaY<0?1.25:0.8,x,y);},{passive:false});
  let drag=null,moved=false;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vb:VB.slice()};moved=false;});
  addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();const dx=(e.clientX-drag.x)/r.width*VB[2],dy=(e.clientY-drag.y)/r.height*VB[3];if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4){moved=true;svg.classList.add('drag');}if(moved){VB[0]=drag.vb[0]-dx;VB[1]=drag.vb[1]-dy;clampVB();setVB();}});
  addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
  svg.addEventListener('click',e=>{if(moved)return;const el=e.target.closest('.c');if(!el)return;const ci=M.byName.get(MAP.c[+el.dataset.m].n);if(ci!=null)openCountry(ci);});
  svg.addEventListener('mousemove',e=>{const el=e.target.closest('.c');if(!el||drag){tip.classList.add('hidden');return;}const c=countryAt(+el.dataset.m);if(!c){tip.classList.add('hidden');return;}
    let h=`<b>${esc(cname(c))}</b>`;const k=UI.mapLayer==='all'?-1:M.bi[UI.mapLayer];
    if(k<0)h+=esc(t('drOnshore',c.on,M.banks.length));else{const cell=c.cells[k];h+=esc(t('m.'+cell.code)||cell.code)+(cell.era?' · '+esc(cell.era):'');}
    tip.innerHTML=h;tip.classList.remove('hidden');tip.style.left=Math.min(innerWidth-290,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';});
  svg.addEventListener('mouseleave',()=>tip.classList.add('hidden'));
  box.querySelector('.mapctl').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.zr){VB=[0,0,MAP.w,MAP.h];setVB();}else zoom(+b.dataset.zm);};
  box.querySelector('.zoomto').onclick=e=>{const b=e.target.closest('button');if(!b)return;const cont=b.dataset.z;if(!cont){VB=[0,0,MAP.w,MAP.h];setVB();return;}
    /* Cadres fixes par continent, calculés par outils/carte (évite les territoires d'outre-mer) */
    const zb=MAP.z&&MAP.z[cont];if(!zb)return;const [x0,y0,x1,y1]=zb;const pad=6;let w=x1-x0+pad*2,h=y1-y0+pad*2;if(w/h>MAP.w/MAP.h)h=w*MAP.h/MAP.w;else w=h*MAP.w/MAP.h;VB=[(x0+x1)/2-w/2,(y0+y1)/2-h/2,w,h];setVB();};
}

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}

function modal(html){$('#mdBox').innerHTML=html;$('#modal').classList.add('on');const i=$('#mdBox').querySelector('input');if(i)i.focus();}

  const done=v=>{closeModal();res(v);};$('#mkc').onclick=()=>done(null);
  const ok=()=>{const a=$('#mk1').value;if(confirm2){if(a.length<12)return $('#mke').textContent=t('pKeyShort');if(a!==$('#mk2').value)return $('#mke').textContent=t('lkMismatch');}if(!a)return;done(a);};
  $('#mko').onclick=ok;$('#mdBox').onkeydown=e=>{if(e.key==='Enter')ok();};});}

  const done=v=>{closeModal();res(v);};$('#mpc').onclick=()=>done(null);$('#mpo').onclick=()=>done($('#mp1').value);$('#mdBox').onkeydown=e=>{if(e.key==='Enter')done($('#mp1').value);};});}
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>res(i.files[0]||null);i.click();});}
async function saveAs(name,text,desc,ext){
  if(!window.showSaveFilePicker){alert(t('noPicker'));return false;}
  try{const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:desc,accept:{'application/octet-stream':[ext]}}]});const w=await h.createWritable();await w.write(text);await w.close();return true;}
  catch(e){if(e&&e.name==='AbortError')return false;alert(t('err',e.message));return false;}
}

/* ---------- Dossier d'équipe (partagé par les deux éditions) ---------- */
async function teamKeyFrom(pw,saltB64){return deriveKey(pw,fromB64(saltB64));}
async function readJSONFile(dir,name){try{const fh=await dir.getFileHandle(name);const f=await fh.getFile();return JSON.parse(await f.text());}catch(e){return null;}}
async function writeFile(dir,name,text){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close();}
async function folderHandle(ask){const h=await kvGet('folder');if(!h)return null;let p=await h.queryPermission({mode:IS_ADMIN?'readwrite':'read'});if(p!=='granted'&&ask)p=await h.requestPermission({mode:IS_ADMIN?'readwrite':'read'});return p==='granted'?h:{needPerm:true,h};}
async function verifyTeam(team,pw){const k=await teamKeyFrom(pw,team.salt);try{const w=await dec(k,team.witness);return w==='ca-team-ok'?k:null;}catch(e){return null;}}



/* ---------- Standard : édition de l'équipe ---------- */
async function applyEdition(ed,pw){
  const k=await teamKeyFrom(pw,ed.salt);const data=await dec(k,ed);
  STATE.data=data;STATE.edition={n:ed.n,date:ed.date,author:ed.author};STATE.team={pw,salt:ed.salt};await saveVault();buildModel();
}
async function stdSync(ask){
  if(IS_ADMIN||!STATE||!STATE.team)return 'none';
  const h=await folderHandle(ask);if(!h)return 'none';if(h.needPerm){UI.needPerm=true;return 'perm';}
  UI.needPerm=false;const ed=await readJSONFile(h,EDITION_FILE);if(!ed)return 'noed';
  if(STATE.edition&&STATE.edition.n>=ed.n)return 'same';
  try{await applyEdition(ed,STATE.team.pw);return 'new';}catch(e){return 'bad';}
}
async function stdAutoSync(){const r=await stdSync(false);if(r==='new'){toast(t('eUpdated',STATE.edition.n));render();}else if(r==='perm'){render();}}
if(!IS_ADMIN){setInterval(()=>{if(KEY)stdAutoSync();},5*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&KEY)stdAutoSync();});}
async function viewEdition(main){
  const e=STATE.edition;
  main.innerHTML=`<div class="card pad"><h3 style="margin-bottom:6px">${esc(t('eTitle'))}</h3><p class="small muted" style="margin:0 0 12px">${esc(t('eIntro'))}</p>
   <p id="eSt" style="margin:0 0 6px">${esc(e?t('eCur',e.n,fmtDT(e.date),e.author||'—'):t('eNone'))}</p><p id="eFo" class="small muted" style="margin:0 0 12px"></p>
   <div class="row"><button class="btn primary" id="eCo">${esc(t('eConnect'))}</button><button class="btn" id="eRf">${esc(t('eRefresh'))}</button><button class="btn" id="eFi">${esc(t('eFile'))}</button></div>
   <div id="eMsg" style="margin-top:12px"></div></div>`;
  const msg=(cls,txt)=>$('#eMsg').innerHTML=`<div class="callout ${cls}">${esc(txt)}</div>`;
  const h=await folderHandle(false);if(h)$('#eFo').textContent=t('eFolderOk',h.needPerm?h.h.name:h.name);
  $('#eCo').onclick=async()=>{if(!window.showDirectoryPicker)return alert(t('noPicker'));let dir;try{dir=await window.showDirectoryPicker({mode:'read',id:'ca-team'});}catch(x){return;}
    const team=await readJSONFile(dir,TEAM_FILE);if(!team)return msg('err',t('pMissing',TEAM_FILE));
    const pw=await askKey(t('eConnect'),false);if(!pw)return;if(!(await verifyTeam(team,pw)))return msg('err',t('pKeyBad'));
    await kvSet('folder',dir);STATE.team={pw,salt:team.salt};await saveVault();
    const ed=await readJSONFile(dir,EDITION_FILE);if(!ed){render();return msg('warn',t('eNoEd'));}
    try{await applyEdition(ed,pw);toast(t('eUpdated',ed.n));render();}catch(x){msg('err',t('eBadFile'));}};
  $('#eRf').onclick=async()=>{const r=await stdSync(true);if(r==='new'){toast(t('eUpdated',STATE.edition.n));render();}else if(r==='same')msg('info',t('eUpToDate',STATE.edition.n));else if(r==='noed')msg('warn',t('eNoEd'));else if(r==='bad')msg('err',t('eBadFile'));else if(r==='perm')msg('warn',t('eNeedPerm'));else msg('warn',t('eNone'));};
  $('#eFi').onclick=async()=>{const f=await pickFile('.cae');if(!f)return;let ed;try{ed=JSON.parse(await f.text());}catch(x){return msg('err',t('eBadFile'));}
    if(!ed||ed.kind!=='ca-edition')return msg('err',t('eBadFile'));const pw=(STATE.team&&STATE.team.salt===ed.salt&&STATE.team.pw)||await askKey(t('eFile'),false);if(!pw)return;
    try{await applyEdition(ed,pw);toast(t('eUpdated',ed.n));render();}catch(x){msg('err',t('eBadFile'));}};
}

/* ---------- Démarrage ---------- */
(function(){
  const l=lsGet('lang');LANG=(l&&L[l])?l:((navigator.language||'fr').slice(0,2)in L?(navigator.language||'fr').slice(0,2):'fr');
  const r0=render;render=function(){r0();if(!IS_ADMIN&&UI.needPerm&&KEY){const b=document.createElement('div');b.className='callout warn row';b.style.marginBottom='12px';b.innerHTML=`<span class="grow">${esc(t('eNeedPerm'))}</span><button class="btn sm" id="rePerm">${esc(t('pReconnect'))}</button>`;$('#main').prepend(b);$('#rePerm').onclick=async()=>{const r=await stdSync(true);if(r==='new')toast(t('eUpdated',STATE.edition.n));render();};}};
  showLock();
})();
</script>
